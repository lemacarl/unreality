# SwiftLint configuration. Run `swiftlint --strict` from the repo root
# (warnings fail). Pinned version: see CONTRIBUTING.md, "Tool versions".
# SwiftLint refuses to run with a different version; CI checks this value
# against scripts/ci/tool-versions.env.
swiftlint_version: 0.65.1

included:
  - Package.swift
  - Sources
  - Tests
  - App

excluded:
  - .build
  - DerivedData
  - Unreality.xcodeproj

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_whitespace_closing_braces

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true

custom_rules:
  # ADR 0001: UnrealityCore is pure logic; OS integrations live in
  # UnrealityPlatform behind protocols. Regex-based allow-lists (not
  # deny-lists): an import of any module not named fails. The regex is
  # unanchored, so attributes (@preconcurrency, @_exported, @testable,
  # @_spi(...)), access levels (internal/public/package/private/fileprivate
  # import), backticked names, a leading comment, or code before the import
  # on the same line (`let x = 1; import AppKit`) do not hide it. The
  # lookbehind skips identifiers such as `reimport` or `x.import`; the atomic
  # group keeps `import struct Foundation.Data` from backtracking into a
  # false positive. Matches inside comments and strings are ignored.
  # Known residual (contrived): a comment between `import` and the module
  # name, e.g. `import /* c */ AppKit`, is not caught here; CI's compiler
  # backstop (scripts/ci/check-core-imports.py) catches it and reads its
  # allow-list from this rule's regex, so keep the `(?!(?:A|B|...)\b)` form.
  # GRDB (ADR 0002, storage, #16) is used only by the core; the core's tests
  # reach storage through UnrealityCore's API.
  # How to verify: CONTRIBUTING.md, "Lint rules".
  core_no_os_imports:
    name: "UnrealityCore must not import OS frameworks"
    included: "Sources/UnrealityCore/.*\\.swift"
    regex: "(?<![\\w.`])import\\s+(?>(?:(?:typealias|struct|class|enum|protocol|let|var|func)\\s+)?)`?(?!(?:Foundation|Dispatch|Observation|Synchronization|RegexBuilder|GRDB)\\b)\\w+"
    excluded_match_kinds: [comment, doccomment, string]
    message: "UnrealityCore may only import Foundation, Dispatch, Observation, Synchronization, RegexBuilder and GRDB; put OS integrations behind a protocol in UnrealityPlatform."
    severity: error
  # Same guard for the core's tests (fakes only), which may also import the
  # module under test and Swift Testing.
  core_tests_no_os_imports:
    name: "UnrealityCoreTests must not import OS frameworks"
    included: "Tests/UnrealityCoreTests/.*\\.swift"
    regex: "(?<![\\w.`])import\\s+(?>(?:(?:typealias|struct|class|enum|protocol|let|var|func)\\s+)?)`?(?!(?:Foundation|Dispatch|Observation|Synchronization|RegexBuilder|UnrealityCore|Testing)\\b)\\w+"
    excluded_match_kinds: [comment, doccomment, string]
    message: "UnrealityCoreTests may only import Foundation, Dispatch, Observation, Synchronization, RegexBuilder, UnrealityCore and Testing; use fakes, not OS frameworks."
    severity: error
