# SwiftLint configuration. Run `swiftlint --strict` from the repo root
# (warnings fail). Pinned version: see CONTRIBUTING.md, "Tool versions".
included:
  - Package.swift
  - Sources
  - Tests
  - App

excluded:
  - .build
  - DerivedData
  - Unreality.xcodeproj

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_whitespace_closing_braces

analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true

custom_rules:
  # ADR 0001: UnrealityCore is pure logic; OS integrations live in
  # UnrealityPlatform behind protocols. Allow-list, not deny-list: any import
  # of a module not named here fails, including attributed forms
  # (@preconcurrency, @_exported, @testable, @_spi(...)) and scoped forms
  # (import struct X.Y). The atomic group keeps `import struct Foundation.Data`
  # from backtracking into a false positive. Comments and strings are ignored.
  # GRDB is added to the list by the storage issue (#16). How to verify the
  # rule: see CONTRIBUTING.md, "Lint rules".
  core_no_os_imports:
    name: "UnrealityCore must not import OS frameworks"
    included: "(Sources/UnrealityCore|Tests/UnrealityCoreTests)/.*\\.swift"
    regex: "^\\s*(?:@\\w+(?:\\([^)\\n]*\\))?\\s+)*import\\s+(?>(?:(?:typealias|struct|class|enum|protocol|let|var|func)\\s+)?)(?!(?:Foundation|Dispatch|Observation|Synchronization|RegexBuilder|UnrealityCore|Testing)\\b)\\w+"
    excluded_match_kinds: [comment, doccomment, string]
    message: "UnrealityCore (and its tests) may only import Foundation, Dispatch, Observation, Synchronization, RegexBuilder (tests also UnrealityCore and Testing); put OS integrations behind a protocol in UnrealityPlatform."
    severity: error
