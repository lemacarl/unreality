# XcodeGen spec for the Unreality app shell. Generate the project with
# `xcodegen generate`; never hand-edit Unreality.xcodeproj (it is gitignored).
name: Unreality

options:
  bundleIdPrefix: com.lemacarl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.46.0"

packages:
  Unreality:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Unreality:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies:
      # UnrealityCore brings GRDB (ADR 0002) in transitively; Xcode resolves
      # it from Package.swift / Package.resolved.
      - package: Unreality
        product: UnrealityCore
      - package: Unreality
        product: UnrealityPlatform
    settings:
      base:
        # Must match AppIdentity.bundleIdentifier. Keep stable: macOS ties
        # Screen Recording / Camera / Accessibility grants to it.
        PRODUCT_BUNDLE_IDENTIFIER: com.lemacarl.unreality
        PRODUCT_NAME: Unreality
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Unreality
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Shown in the Automation prompt for each browser (#19, docs/PRIVACY.md).
        INFOPLIST_KEY_NSAppleEventsUsageDescription: >-
          Unreality reads the address of the active tab in this browser to group your
          time by site. Query strings are removed and excluded sites are never stored.
        # Only applied when signing with a real identity; ad-hoc Debug
        # builds do not get the hardened runtime.
        ENABLE_HARDENED_RUNTIME: YES
    # The hardened runtime blocks Apple Events without this entitlement;
    # browser URLs (#19) are read with them. XcodeGen writes the file.
    entitlements:
      path: App/Unreality.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    # Signing lives in the xcconfig (not here) so a gitignored
    # Config/Local.xcconfig can override it; target settings in this file
    # would take precedence over the xcconfig. CI passes
    # CODE_SIGNING_ALLOWED=NO. See CONTRIBUTING.md, "Local development".
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

schemes:
  Unreality:
    build:
      targets:
        Unreality: all
    run:
      config: Debug
    archive:
      config: Release
